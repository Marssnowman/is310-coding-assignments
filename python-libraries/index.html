<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guarantee Game Data Entry Tool</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 16px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #cccccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>College Football Guarantee Game Data Entry Tool</h1>

        <form id="gameForm">

            <label for="game_date">Game Date</label>
            <input type="date" id="game_date" required>

            <label for="home_team">Home Team</label>
            <input type="text" id="home_team" required>

            <label for="away_team">Away Team</label>
            <input type="text" id="away_team" required>

            <label for="home_level">Home Team Level</label>
            <select id="home_level" required>
                <option value="">Select one</option>
                <option value="FBS">FBS</option>
                <option value="FCS">FCS</option>
            </select>

            <label for="away_level">Away Team Level</label>
            <select id="away_level" required>
                <option value="">Select one</option>
                <option value="FBS">FBS</option>
                <option value="FCS">FCS</option>
            </select>

            <label for="payout_amount">Payout Amount</label>
            <input type="number" id="payout_amount" required>

            <label for="payout_source">Payout Source</label>
            <input type="text" id="payout_source" required>

            <label for="source_url">Source URL</label>
            <input type="url" id="source_url" required>

            <button type="submit">Add Record</button>

        </form>

    </div>


    <div class="container">

        <h2>Entered Records</h2>

        <table id="recordsTable">

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Home Team</th>
                    <th>Away Team</th>
                    <th>Home Level</th>
                    <th>Away Level</th>
                    <th>Payout</th>
                    <th>Source</th>
                </tr>
            </thead>

            <tbody></tbody>

        </table>

        <button id="downloadButton">
            Download JSON
        </button>

    </div>


    <script>

        const records = [];

        const form = document.getElementById("gameForm");
        const tableBody = document.querySelector("#recordsTable tbody");
        const downloadButton = document.getElementById("downloadButton");


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const record = {
                game_date: document.getElementById("game_date").value,
                home_team: document.getElementById("home_team").value,
                away_team: document.getElementById("away_team").value,
                home_level: document.getElementById("home_level").value,
                away_level: document.getElementById("away_level").value,
                payout_amount: document.getElementById("payout_amount").value,
                payout_source: document.getElementById("payout_source").value,
                source_url: document.getElementById("source_url").value
            };

            records.push(record);

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${record.game_date}</td>
                <td>${record.home_team}</td>
                <td>${record.away_team}</td>
                <td>${record.home_level}</td>
                <td>${record.away_level}</td>
                <td>${record.payout_amount}</td>
                <td>${record.payout_source}</td>
            `;

            tableBody.appendChild(row);

            form.reset();

        });


        downloadButton.addEventListener("click", function() {

            if (records.length < 2) {
                alert("Please enter at least two records before downloading.");
                return;
            }

            const data = JSON.stringify(records, null, 4);

            const blob = new Blob(
                [data],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = "guarantee_games_web.json";

            link.click();

            URL.revokeObjectURL(url);

        });

    </script>

</body>

</html>
